# Jeff. Built from his selfie: brown hair, short faded sides and a longer
# top swept up and over, rectangular gunmetal glasses, short beard along the
# jawline going gray at the chin, blue-green eyes, freckles, charcoal polo.
name: Jeff
skin: "#f0c4a2"
ears: true
freckles: true
freckle_color: "#c98058"
glasses:
  color: "#55585e"
hair:
  style: quiff
  color: "#5e4838"
  highlight: "#8a7462"
facial_hair:
  style: jaw_beard     # full_beard for the big version
  color: "#8c4c2a"
  gray: "#b9aea2"
  opacity: 0.9
eyes:
  pupil: "#3f7f80"     # blue-green
  brows: normal
outfit:
  top:
    style: polo
    color: "#36383d"
  pants: "#4a5a78"     # guessed, not in the photo
  shoes: "#2a2622"
voice:
  # Cloned from this sample when it exists (see README), else espeak below.
  reference: voices/jeff/reference.wav
  exaggeration: 0.5    # 0.25 flat ... 1.0 very animated
  espeak: en-us+m3     # placeholder robot voice
  pitch: 40
  speed: 165
